apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    environment: ${ENVIRONMENT}
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/launch-stage: GA
      labels:
        revision: ${REVISION_TAG}
    spec:
      serviceAccountName: ${CLOUD_RUN_SA}
      containers:
        - image: ${CONTAINER_IMAGE}
          ports:
            - name: http1
              containerPort: ${CONTAINER_PORT}
          env:
            - name: ENVIRONMENT
              value: ${ENVIRONMENT}

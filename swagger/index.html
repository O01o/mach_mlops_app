<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MACH MLOps API</title>
  <link rel="stylesheet" href="./swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="./swagger-ui-bundle.js"></script>
  <script src="./swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      const spec = params.get("spec") || "openapi.yaml";
      const specUrl = new URL(spec, window.location.href);
      specUrl.searchParams.set("v", Date.now().toString());

      SwaggerUIBundle({
        url: specUrl.toString(),
        dom_id: "#swagger-ui",
        deepLinking: true,
        persistAuthorization: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
